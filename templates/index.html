<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>{{ title }}</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
      <link
         href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
         rel="stylesheet" />
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
      <link rel="stylesheet" href="/static/css/styles.css" />
   </head>
   <body>
      <div id="app">
         <nav class="top-nav" aria-label="Main navigation">
            <div class="left">
               <div class="brand-mark"><i class="fa-solid fa-bolt"></i></div>
               <div class="brand-copy">
                  <h1 class="logo"><a href="#">{{ display_name }}</a></h1>
                  <p class="path" aria-label="Current folder">
                     <span class="dir">~</span>
                     <i class="fa-solid fa-chevron-right"></i>
                     <span class="dir">Documents</span>
                     <i class="fa-solid fa-chevron-right"></i>
                     <span class="dir">Projects</span>
                  </p>
               </div>
            </div>
            <div class="right">
               <button class="upload">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                  <span>Upload</span>
               </button>
                <button class="new-file">
                   <i class="fa-solid fa-file-circle-plus"></i>
                   <span>New File</span>
                </button>
                <button class="new-folder">
                   <i class="fa-solid fa-folder-plus"></i>
                   <span>New Folder</span>
                </button>
               <div class="view" aria-label="View options">
                  <button
                     class="grid active"
                     onclick="view('grid', event)"
                     aria-label="Grid view">
                     <i class="fa-solid fa-table-cells-large"></i>
                  </button>
                  <button
                     class="list"
                     onclick="view('list')"
                     aria-label="List view">
                     <i class="fa-solid fa-list"></i>
                  </button>
               </div>
            </div>
         </nav>

         <main class="content-shell">
            <section class="hero-card">
               <div>
                  <span class="eyebrow"
                     ><i class="fa-solid fa-shield-halved"></i> Secure local
                     sharing</span
                  >
                  <h2>Manage your files at warp speed.</h2>
                  <p>
                     Browse, upload, rename, and organize shared files from any
                     device on your network.
                  </p>
               </div>
               <div class="hero-stats">
                  <div><strong id="items">0</strong><span>Items</span></div>
                  <div>
                     <strong><i class="fa-solid fa-wifi"></i></strong
                     ><span>{{ status }}</span>
                  </div>
               </div>
            </section>

            <nav class="search-nav" aria-label="File tools">
               <div class="search-bar">
                  <i class="fa-solid fa-magnifying-glass search-icon"></i>
                  <input type="search" placeholder="Search files..." />
               </div>
               <p class="hint">
                  <i class="fa-solid fa-computer-mouse"></i> Right-click a file
                  for actions
               </p>
            </nav>

            <div id="files" class="grid-view"></div>
         </main>

         <div id="menu">
            <button data-action="download">
               <p><i class="fa-solid fa-download"></i>Download</p>
            </button>
            <button data-action="rename">
               <p><i class="fa-solid fa-pen-to-square"></i>Rename</p>
            </button>
            <button class="delete" data-action="delete">
               <p><i class="fa-solid fa-trash-can"></i>Delete</p>
            </button>
         </div>
      </div>
      <script src="/static/js/index.js"></script>
   </body>
</html>
